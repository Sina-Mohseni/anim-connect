<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIM'CONNECT - Hourglass Tower</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Circuit Animation -->
    <div class="circuit-background"></div>

    <!-- Header avec logo Hourglass Tower -->
    <header class="header">
        <div class="header-content">
            <div class="logo" id="logo-home">
                <div class="hourglass-icon">⏳</div>
                <div class="logo-text-container">
                    <span class="logo-title">ANIM'CONNECT</span>
                    <span class="logo-subtitle">Hourglass Tower</span>
                </div>
            </div>
            <div class="header-status">
                <span class="traveler-badge">🧳 Voyageur</span>
            </div>
        </div>
    </header>

    <!-- Navigation Menu -->
    <nav class="nav-menu">
        <button class="nav-item active" data-page="tower">
            <span class="nav-icon">🏛️</span>
            <span class="nav-label">La Tour</span>
        </button>
        <button class="nav-item" data-page="worlds">
            <span class="nav-icon">🌍</span>
            <span class="nav-label">Mondes</span>
        </button>
        <button class="nav-item" data-page="sagas">
            <span class="nav-icon">📚</span>
            <span class="nav-label">Sagas</span>
        </button>
        <button class="nav-item" data-page="about">
            <span class="nav-icon">ℹ️</span>
            <span class="nav-label">À propos</span>
        </button>
    </nav>

    <!-- Main Content Area (contenu dynamique) -->
    <main class="main-content" id="app">
        <!-- Le contenu sera injecté dynamiquement ici par JavaScript -->
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <span class="footer-text">⏳ Chaque seconde compte dans l'Hourglass Tower ⏳</span>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="tower.js" type="module"></script>
</body>
</html>
